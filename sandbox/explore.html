<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Try Violet · A fictional case</title><link rel="stylesheet" href="/demo/app-original.css"><link rel="stylesheet" href="sandbox.css"></head><body>
<div class="demo-note"><span>INTERACTIVE DEMO · FICTIONAL CASES</span><span id="connection">Prepared responses · local preview</span></div>
<main class="shell"><aside class="rail"><a class="brand" href="/">Violet.</a><button data-action="home" class="nav active">⌂ <span>Home</span></button><div class="rail-label">YOUR DEMO CASES</div><button class="nav" data-action="marcus">Marcus Doyle<small>Intake · Ready for a plan</small></button><button class="nav" data-action="maya">Maya Lindgren<small>Plan · Awaiting your review</small></button><div class="rail-bottom">Your judgment.<br>A little more room for it.</div></aside>
<section class="main"><header><div><h1 id="page-title">Home</h1><span id="page-subtitle">Your work, across cases.</span></div><div class="tools"><button id="sound" aria-pressed="false">♪ Sound off</button><button id="reset">Reset demo ↺</button></div></header>
